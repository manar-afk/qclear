name: QCLEAR CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test, Lint & Standalone Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Suite (33 Tests: Unit, Integration, A11y)
        run: npm test

      - name: Run Strict TypeScript Check
        run: npm run typecheck

      - name: Run Next.js Linter
        run: npm run lint

      - name: Run Standalone Next.js Production Build
        run: npm run build
